<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCook - My Meal Plans</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <h2 class="logo"> EasyCook</h2>

        <a href="index.html">Recipe Finder</a>
        <a href="mealplan.html" class="active"> My Meal Plans</a>
    </nav>

    <main id="mealPlanPage">

        <!-- Welcome Section -->
        <section class="welcome-section">
            <p class="welcome-label">YOUR PERSONAL MEAL PLANNER</p>

            <h1>My Meal Plans </h1>

            <p>Plan your meals, organise your recipes and make every day delicious!</p>
        </section>

        <!-- Add New Meal Plan -->
        <section class="meal-form-section">

            <h2> Add New Meal Plan</h2>

            <div class="meal-form">

                <div class="form-group">
                    <label for="mealName">Recipe Name:</label>
                    <input type="text" id="mealName" placeholder="Enter recipe name">
                </div>

                <div class="form-group">
                    <label for="mealDate">Meal Date:</label>
                    <input type="date" id="mealDate">
                </div>

                <div class="form-group">
                    <label for="mealType">Meal Type:</label>
                    <select id="mealType">
                        <option value="">Select meal type</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="servings">Number of Servings:</label>
                    <input type="number" id="servings" min="1" placeholder="Enter servings">
                </div>

                <button type="button" id="saveMealBtn">
                    Save Meal Plan 
                </button>

            </div>

        </section>

        <!-- Meal Summary -->
        <div id="mealSummary"></div>

        <!-- Saved Meal Plans -->
        <section class="saved-plans-section">

            <h2> My Saved Meal Plans</h2>

            <div id="savedPlans"></div>

        </section>

    </main>

    <script src="mealplan.js"></script>

</body>
</html>
